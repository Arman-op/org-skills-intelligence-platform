spring:
  application:
    name: org-skills-intelligence-platform
  # --- H2 In-Memory Database (for development) ---
  datasource:
    url: jdbc:h2:mem:org_skills;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  # --- PostgreSQL (uncomment for production) ---
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/org_skills}
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:postgres}
  #   driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-secure-32-char-minimum-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gemini-3.6-flash}
    base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}

llm:
  mock:
    enabled: ${LLM_MOCK_ENABLED:true}

